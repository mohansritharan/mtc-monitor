name: MTC Portal Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Run MTC Portal Monitor
        shell: powershell
        env:
          MTC_USERNAME: ${{ secrets.MTC_USERNAME }}
          MTC_PASSWORD: ${{ secrets.MTC_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mohansritharan/mtc-monitor/main/monitor.py" -OutFile "monitor.py"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mohansritharan/mtc-monitor/main/config.json" -OutFile "config.json"
          if (Get-Command py -ErrorAction SilentlyContinue) {
              py -3 monitor.py
          } else {
              python monitor.py
          }
