name: MTC Portal Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Run MTC Portal Monitor
        shell: powershell
        env:
          MTC_USERNAME: ${{ secrets.MTC_USERNAME }}
          MTC_PASSWORD: ${{ secrets.MTC_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          Set-Location "c:\Users\mohan\OneDrive\Desktop\O`&M\mtc-monitor"
          py -3.12 monitor.py
